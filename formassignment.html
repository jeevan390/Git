<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <center>
    <h1>Student Registration Form</h1>
    <form>
        <fieldset>
            <table bgcolor="lightgrey">
                <tr>
                    <td><label for="first">First Name:</label></td>
                    <td><input type="text" id="first" name="f_n"></td>
                    
                </tr>
                <tr>
                    <td><label for="last">Lirst Name:</label></td>;/'
                
                    <td><input type="text" id="last" name="l_n"></td>  
                </tr>
                <tr>
                    <td><label for="father">Father's Name:</label></td>
                    <td><input type="text" id="father" name="fa_n"></td>
                    
                </tr>
                <tr>
                    <td><label for="mother">Mother's Name:</label></td>
                    <td><input type="text" id="mother" name="m_n"></td>
                     </tr>
                     <tr>
                        <td><label for="date">Date of Birth:</label></td>
                        <td><input type="date" id="date" name="d_b"></td>
                        
                    </tr>
                    <tr>
                        <td><label for="mail">Email:</label></td>
                        <td><input type="email" id="mail" name="e_m"></td>
                        
                    </tr>
                    <tr>
                        <td><label for="gender">Gender:</label></td>
                        <td><input type="radio" id="gender" name="g_r">Male<input type="radio" id="gender" name="g_r">Female</td>
                        
                    </tr>
                    <tr>
                        <td><label for="choose">Choose course:</label></td>
                       <td><select id="choose" name="c_c">
                            <option>---select---</option>
                            <option>Java full stack</option>
                            <option>Python full stack</option>
                            <option>Devops</option></td>

                        </select>
                        
                    </tr>
                    <tr>
                        <td><label for="hobbies">Hobbies:</label></td>
                        <td><input type="checkbox" id="hobbies" name="h_s">Singing<input type="checkbox" id="hobbies" name="d_g">Dancing<input type="checkbox" id="hobbies" name="r_g">Reading</td>
                        
                    </tr>
                    <tr>
                        <td><label for="add">Address:</label></td>
                        <td><textarea id="add" name="a_s"></textarea></td>
                        
                    </tr>
                    <tr>
                        <td><label for="photo">Photo:</label></td>
                        <td><input type="file" id="photo" name="p_o"></td>
                        
                    </tr>
                    <tr><td></td>
                        
                        <td><input type="submit" name="b_n"></td>
                        
                    </tr>
                    
            </table>
        </fieldset>
    </form>
    </center>
</body>
</html>
